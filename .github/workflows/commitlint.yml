name: Commit lint

# Commit messages and pull request titles must follow Conventional Commits (see commitlint.config.mjs).
# The title matters because squash merges use it as the commit message on main.

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    # Editing only the title or description does not change the commits.
    if: github.event_name == 'push' || github.event.action != 'edited'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install commitlint
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint the commits of the pull request
        if: github.event_name == 'pull_request'
        # Event values go through the environment, never straight into the script.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --verbose --from "$BASE" --to "$HEAD"

      - name: Lint the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # A new branch or a force push has no usable "before": check the last commit only.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npx --no -- commitlint --verbose --last
          else
            npx --no -- commitlint --verbose --from "$BEFORE" --to "$AFTER"
          fi

  title:
    name: Pull request title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same types and scopes as commitlint.config.mjs: keep the two lists in sync.
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            core
            analyzers
            artemis
            aspire
            aspnetcore
            azure
            caching
            cli
            data
            efcore
            featureflags
            grpc
            healthchecks
            http
            kafka
            kubernetes
            mongodb
            polly
            rabbitmq
            redis
            servicebus
            templates
            testing
            samples
            docs
            deps
            ci
            release
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of the pull request title "{title}" must start with a lower-case letter.
