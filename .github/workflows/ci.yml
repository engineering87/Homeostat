name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Redis for the integration tests of Homeostat.Redis (they are skipped when no server is available).
    services:
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      HOMEOSTAT_TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        # Locked mode: exactly the versions and hashes in the packages.lock.json files, or the build fails.
        run: dotnet restore Homeostat.slnx --locked-mode

      - name: Build
        run: dotnet build Homeostat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Homeostat.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFilePrefix=results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Pack
        run: dotnet pack Homeostat.slnx --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*

  native-aot:
    # Publishes a small application with Native AOT and runs it: any trimming or AOT warning in Homeostat code fails
    # the publish, and the run checks the main features end to end without reflection.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish with Native AOT
        run: dotnet publish tests/Homeostat.AotSmoke --configuration Release --runtime linux-x64 --output aot

      - name: Run
        run: ./aot/Homeostat.AotSmoke

  templates:
    # Installs the templates from the packages of this commit, creates a project from each one and builds it against
    # the packages of this commit: a template that no longer compiles fails here, not on a user's machine.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack Homeostat.slnx --configuration Release --output "$RUNNER_TEMP/packages"

      - name: Create and build each template
        run: |
          version=$(ls "$RUNNER_TEMP/packages"/Homeostat.Templates.*.nupkg | sed -E 's/.*Homeostat\.Templates\.(.*)\.nupkg/\1/')
          dotnet new install "$RUNNER_TEMP/packages/Homeostat.Templates.$version.nupkg"
          for template in homeostat-webapi homeostat-worker; do
            project="$RUNNER_TEMP/$template"
            dotnet new "$template" --name SmokeApp --output "$project"
            cat > "$project/nuget.config" <<XML
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$RUNNER_TEMP/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
            dotnet build "$project" --configuration Release -warnaserror -p:NuGetAudit=false
          done
