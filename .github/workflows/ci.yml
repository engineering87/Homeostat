name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Redis for the integration tests of Homeostat.Redis (they are skipped when no server is available).
    services:
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      HOMEOSTAT_TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Homeostat.slnx

      - name: Build
        run: dotnet build Homeostat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Homeostat.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFilePrefix=results"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Pack
        run: dotnet pack Homeostat.slnx --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*
