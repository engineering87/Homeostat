name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Redis for the integration tests of Homeostat.Redis (they are skipped when no server is available).
    services:
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      HOMEOSTAT_TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        # Every package version is fixed in Directory.Packages.props (central package management, no ranges or
        # floating versions), so the restore resolves exactly the reviewed versions.
        run: dotnet restore Homeostat.slnx

      - name: Build
        run: dotnet build Homeostat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Homeostat.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFilePrefix=results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Pack
        run: dotnet pack Homeostat.slnx --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*

  kubernetes:
    # The Kubernetes actions against a real API server: a kind cluster, the service account and the Role documented in
    # docs/cloud.md (so a missing permission in the documentation fails here), and a PodDisruptionBudget that must
    # stop an eviction. The fake API server of KubernetesTests cannot show either.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NS: homeostat-it

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Create a kind cluster
        # kind and kubectl are installed on the GitHub-hosted Ubuntu runners.
        run: |
          kind version
          kind create cluster --name homeostat --wait 180s
          kubectl cluster-info

      - name: Set up the workloads, the service account and the Role
        run: |
          kubectl create namespace "$NS"
          kubectl -n "$NS" create deployment weather-api --image=registry.k8s.io/pause:3.10 --replicas=1
          kubectl -n "$NS" create deployment weather-protected --image=registry.k8s.io/pause:3.10 --replicas=1
          kubectl -n "$NS" create poddisruptionbudget weather-protected --selector=app=weather-protected --min-available=1
          kubectl -n "$NS" rollout status deployment/weather-api --timeout=180s
          kubectl -n "$NS" rollout status deployment/weather-protected --timeout=180s
          kubectl -n "$NS" create serviceaccount weather-api
          kubectl apply -f - <<YAML
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata: { name: homeostat, namespace: $NS }
          rules:
            - apiGroups: [""]
              resources: [pods]
              verbs: [get]
            - apiGroups: [""]
              resources: [pods/eviction]
              verbs: [create]
            - apiGroups: [apps]
              resources: [deployments]
              resourceNames: [weather-api]
              verbs: [patch]
            - apiGroups: [apps]
              resources: [deployments/scale]
              resourceNames: [weather-api]
              verbs: [get, patch]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata: { name: homeostat, namespace: $NS }
          subjects: [{ kind: ServiceAccount, name: weather-api, namespace: $NS }]
          roleRef: { kind: Role, name: homeostat, apiGroup: rbac.authorization.k8s.io }
          YAML

          kubectl -n "$NS" create token weather-api --duration=1h > "$RUNNER_TEMP/token"
          kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "$RUNNER_TEMP/ca.crt"
          {
            echo "HOMEOSTAT_TEST_KUBERNETES_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
            echo "HOMEOSTAT_TEST_KUBERNETES_CA=$RUNNER_TEMP/ca.crt"
            echo "HOMEOSTAT_TEST_KUBERNETES_TOKEN=$RUNNER_TEMP/token"
            echo "HOMEOSTAT_TEST_KUBERNETES_NAMESPACE=$NS"
            echo "HOMEOSTAT_TEST_KUBERNETES_POD=$(kubectl -n "$NS" get pods -l app=weather-api -o jsonpath='{.items[0].metadata.name}')"
            echo "HOMEOSTAT_TEST_KUBERNETES_PROTECTED_POD=$(kubectl -n "$NS" get pods -l app=weather-protected -o jsonpath='{.items[0].metadata.name}')"
          } >> "$GITHUB_ENV"

      - name: Test against the cluster
        run: |
          dotnet test tests/Homeostat.Tests --configuration Release --filter "FullyQualifiedName~KubernetesClusterTests" --logger "console;verbosity=normal"

      - name: Cluster state on failure
        if: failure()
        run: kubectl -n "$NS" get all,pdb,events -o wide

  native-aot:
    # Publishes a small application with Native AOT and runs it: any trimming or AOT warning in Homeostat code fails
    # the publish, and the run checks the main features end to end without reflection.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Publish with Native AOT
        run: dotnet publish tests/Homeostat.AotSmoke --configuration Release --runtime linux-x64 --output aot

      - name: Run
        run: ./aot/Homeostat.AotSmoke

  templates:
    # Installs the templates from the packages of this commit, creates a project from each one and builds it against
    # the packages of this commit: a template that no longer compiles fails here, not on a user's machine.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack Homeostat.slnx --configuration Release --output "$RUNNER_TEMP/packages"

      - name: Create and build each template
        run: |
          version=$(ls "$RUNNER_TEMP/packages"/Homeostat.Templates.*.nupkg | sed -E 's/.*Homeostat\.Templates\.(.*)\.nupkg/\1/')
          dotnet new install "$RUNNER_TEMP/packages/Homeostat.Templates.$version.nupkg"
          for template in homeostat-webapi homeostat-worker; do
            project="$RUNNER_TEMP/$template"
            dotnet new "$template" --name SmokeApp --output "$project"
            cat > "$project/nuget.config" <<XML
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$RUNNER_TEMP/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML
            dotnet build "$project" --configuration Release -warnaserror -p:NuGetAudit=false
          done
