name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Homeostat.slnx

      - name: Build
        run: dotnet build Homeostat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Homeostat.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFilePrefix=results"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Pack
        run: dotnet pack Homeostat.slnx --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
