name: Release

# Publishes the packages to NuGet and creates a GitHub release when a version tag is pushed:
#   git tag v0.1.0-preview.1 && git push origin v0.1.0-preview.1
# Requires the repository secret NUGET_API_KEY (a key scoped to the Homeostat* packages).

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget

    services:
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      HOMEOSTAT_TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a semantic version (expected v1.2.3 or v1.2.3-preview.1)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Homeostat.slnx

      - name: Build
        run: dotnet build Homeostat.slnx --configuration Release --no-restore -p:Version=$VERSION

      - name: Test
        run: dotnet test Homeostat.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Homeostat.slnx --configuration Release --no-build -p:Version=$VERSION --output artifacts

      - name: Push to NuGet
        # Symbol packages (.snupkg) next to the .nupkg files are pushed automatically.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "Homeostat $VERSION" --generate-notes $prerelease
