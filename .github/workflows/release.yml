name: Release

# Publishes the packages to NuGet and creates a GitHub release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Publishes with nuget.org trusted publishing: no stored API key. Requires a trusted publishing policy on nuget.org
# (owner engineering87, repository Homeostat, workflow release.yml, environment nuget) and the secret NUGET_USER (the
# nuget.org profile name of the policy owner). Optional: NUGET_SIGNING_CERTIFICATE
# (a code signing certificate as base64 PFX, registered on nuget.org) and NUGET_SIGNING_PASSWORD sign the packages.
# Every release carries an SBOM (SPDX) and a build provenance attestation for each package, also attached to the
# release as homeostat-<version>.intoto.jsonl: see SECURITY.md.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write      # the GitHub release
      id-token: write      # signing the provenance attestations and the nuget.org trusted publishing login
      attestations: write  # storing them

    services:
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      HOMEOSTAT_TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only what reached main through a reviewed, checked pull request is published: a tag on develop or on a
      # feature branch stops here.
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag points to a commit that is not on main. Merge develop into main first, then tag main."
            exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a semantic version (expected v1.2.3 or v1.2.3-rc.1)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore
        # Every package version is fixed in Directory.Packages.props (central package management, no ranges or
        # floating versions), so the restore resolves exactly the reviewed versions.
        run: dotnet restore Homeostat.slnx

      - name: Build
        run: dotnet build Homeostat.slnx --configuration Release --no-restore -p:HomeostatVersion=$VERSION

      - name: Test
        run: dotnet test Homeostat.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack Homeostat.slnx --configuration Release --no-build -p:HomeostatVersion=$VERSION --output artifacts

      - name: Sign packages
        # Only when a certificate is configured; nuget.org then also checks the signature against the certificate
        # registered on the account.
        env:
          NUGET_SIGNING_CERTIFICATE: ${{ secrets.NUGET_SIGNING_CERTIFICATE }}
          NUGET_SIGNING_PASSWORD: ${{ secrets.NUGET_SIGNING_PASSWORD }}
        run: |
          if [ -z "$NUGET_SIGNING_CERTIFICATE" ]; then
            echo "No signing certificate configured: packages are published unsigned (nuget.org adds its repository signature)."
            exit 0
          fi
          certificate="$RUNNER_TEMP/signing.pfx"
          trap 'rm -f "$certificate"' EXIT
          echo "$NUGET_SIGNING_CERTIFICATE" | base64 --decode > "$certificate"
          for package in artifacts/*.nupkg; do
            dotnet nuget sign "$package" \
              --certificate-path "$certificate" \
              --certificate-password "$NUGET_SIGNING_PASSWORD" \
              --timestamper http://timestamp.digicert.com \
              --overwrite
            dotnet nuget verify "$package" --all
          done

      - name: SBOM
        # The dependencies of every package, from the build output (.deps.json), in SPDX.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./src
          format: spdx-json
          output-file: artifacts/homeostat-${{ env.VERSION }}.spdx.json
          upload-release-assets: false

      - name: Build provenance
        # Signed statements that each package was built by this workflow from this commit:
        #   gh attestation verify Homeostat.1.0.0.nupkg --repo engineering87/Homeostat
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.spdx.json

      - name: Attach the provenance to the release
        # The same signed bundle as a release asset, for verifiers that do not query GitHub's attestation API
        # (for example the Signed-Releases check of OpenSSF Scorecard). It is not pushed to NuGet.
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "artifacts/homeostat-$VERSION.intoto.jsonl"

      - name: NuGet login
        # Exchanges the workflow's OIDC token for an API key valid for one hour, scoped by the nuget.org policy.
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        # Symbol packages (.snupkg) next to the .nupkg files are pushed automatically.
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "Homeostat $VERSION" --generate-notes $prerelease
